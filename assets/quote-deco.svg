<svg xmlns="http://www.w3.org/2000/svg" width="540" height="46" viewBox="0 0 540 46" fill="none" role="img" aria-label="Daily dev wisdom">
<style>
@keyframes qrun{from{stroke-dashoffset:14}to{stroke-dashoffset:-106}}
@keyframes qglow{0%,100%{opacity:.9}50%{opacity:.3}}
@keyframes qfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="qtr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0b48a" stop-opacity="0"/><stop offset=".5" stop-color="#ffd9a8"/><stop offset="1" stop-color="#b77df0" stop-opacity="0"/></linearGradient></defs>
<g style="animation:qfloat 5s ease-in-out infinite">
<text x="244" y="34" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#f0b48a">&#8220;</text>
<text x="276" y="34" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#b77df0">&#8221;</text>
</g>
<circle cx="210" cy="24" r="2" fill="#ffd9a8" style="animation:qglow 3.2s ease-in-out infinite"/>
<circle cx="330" cy="24" r="2" fill="#f0b7d2" style="animation:qglow 3.2s ease-in-out -1.6s infinite"/>
<path d="M20 38H190" stroke="url(#qtr)" stroke-opacity=".4"/>
<path d="M350 38H520" stroke="url(#qtr)" stroke-opacity=".4"/>
<path d="M20 38H190" pathLength="100" stroke="url(#qtr)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 106" style="animation:qrun 6s linear infinite"/>
<path d="M350 38H520" pathLength="100" stroke="url(#qtr)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 106" style="animation:qrun 6s linear -3s infinite"/>
</svg>